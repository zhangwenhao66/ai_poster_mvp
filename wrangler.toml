# 生产（Workers Builds + Git）：部署命令请用  npx wrangler deploy  或  npm run cf:workers-deploy
# 不要用 wrangler pages deploy —— 那是「Cloudflare Pages」产品 API；Git 连到的是 Worker 时会出现 8000007。
#
# 本地 Vite + Pages Functions：npm run dev（wrangler.vite.toml）
# 本地仅预览构建结果：npm run pages:dev（wrangler.pages.toml）
#
# 机密：Worker / Pages 变量里配置 ARK_API_KEY

name = "ai-poster"
main = "worker/entry.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
