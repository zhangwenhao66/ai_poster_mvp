# Cloudflare Pages（Git / Workers Builds）
# - 构建命令：npm run build
# - 部署命令：npm run cf:pages-deploy（或 npx wrangler pages deploy）
# - name 须与控制台里 Pages 项目名称一致；不一致时改本字段或加 --project-name
# - 机密：ARK_API_KEY 在 Pages 变量里配置
# - 本地联调：npm run dev（使用 wrangler.vite.toml，见 package.json）
#
# CI 若报 Authentication error [10000]：构建环境里的 CLOUDFLARE_API_TOKEN 权限不够或已失效。
#   在 Cloudflare 控制台「我的个人资料 → API 令牌」新建令牌，模板选「编辑 Cloudflare Workers」，
#   或至少包含：帐户 → Cloudflare Pages → 编辑；不要用仅 DNS/CDN 的受限令牌。
#   也可先删掉构建变量里的 CLOUDFLARE_API_TOKEN，改用 Git 集成默认凭据（若界面允许不设部署命令）。

name = "ai-poster"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"
