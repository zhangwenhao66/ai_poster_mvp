# Cloudflare Pages（Git 连接）说明：
# - 构建命令：npm run build
# - 构建输出目录：dist
# - 「部署命令 / Deploy command」请留空，不要填 npx wrangler deploy（那是 Workers，会导致 Missing entry-point）。
#   Pages 会自动发布 dist，并打包根目录下的 functions/。
# - 机密：在 Pages 项目设置里添加 Secret「ARK_API_KEY」。
# - 本机 wrangler 直传：npm run pages:deploy
# - 本地 .dev.vars 放 ARK_API_KEY（勿提交）

name = "ai-poster"
compatibility_date = "2025-04-01"
# 不设 pages_build_output_dir，否则 wrangler 4 会把 dist 当作静态目录，
# 与 `wrangler pages dev -- vite` 的“代理命令”模式冲突（报 Specify either a directory OR a proxy command）。
# 部署时请在 CLI 显式传目录：`wrangler pages deploy dist`
