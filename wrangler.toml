# Cloudflare Pages（Git / Workers Builds）
# - 构建命令：npm run build
# - 部署命令：npm run cf:pages-deploy（或 npx wrangler pages deploy）
# - name 须与控制台里 Pages 项目名称一致；不一致时改本字段或加 --project-name
# - 机密：ARK_API_KEY 在 Pages 变量里配置
# - 本地联调：npm run dev（使用 wrangler.vite.toml，见 package.json）

name = "ai-poster"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"
